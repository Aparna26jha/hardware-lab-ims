<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Hardware Lab IMS</title>
  <style>
    :root {
      --bg: #e6eeea;
      --ink: #17211c;
      --muted: #5c6b64;
      --panel: #f8fbf9;
      --line: #c5d4cc;
      --teal: #0c5c56;
      --teal-deep: #083f3b;
      --chip: #e7f3f1;
      --amd: #7c2430;
      --amd-bg: #f8e8ea;
      --wipro: #1d4e89;
      --wipro-bg: #e7eef8;
      --danger: #8d2d2d;
      --ok: #146b45;
      --warn: #8a5a12;
      --shadow: 0 16px 40px rgba(23, 33, 28, 0.08);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      color: var(--ink);
      background:
        radial-gradient(1200px 400px at 10% -10%, #f4faf7 0%, transparent 50%),
        linear-gradient(180deg, #dfeae4 0%, var(--bg) 220px);
      font: 15px/1.45 "Segoe UI", "Avenir Next", "Helvetica Neue", sans-serif;
    }
    button, input, select, textarea { font: inherit; color: inherit; }
    button { cursor: pointer; }
    .wrap { width: min(1180px, calc(100% - 28px)); margin: 0 auto; }
    .auth-screen { min-height: 100vh; display: grid; place-items: center; padding: 28px 14px; }
    .card {
      width: min(460px, 100%);
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 18px;
      box-shadow: var(--shadow);
      padding: 28px 26px 22px;
    }
    .brand { display: flex; gap: 12px; align-items: center; margin-bottom: 8px; }
    .mark {
      width: 42px; height: 42px; border-radius: 12px;
      background: var(--teal-deep); color: #f4fffc;
      display: grid; place-items: center; font-weight: 700; letter-spacing: 0.04em;
    }
    h1 { font-size: 22px; line-height: 1.2; margin: 0; }
    h2 { font-size: 18px; margin: 0 0 8px; }
    .sub { color: var(--muted); margin: 6px 0 18px; }
    label { display: block; font-size: 13px; font-weight: 650; margin: 12px 0 6px; }
    input, select, textarea {
      width: 100%;
      border: 1px solid var(--line);
      background: #fff;
      border-radius: 10px;
      padding: 10px 12px;
      outline: none;
    }
    textarea { min-height: 84px; resize: vertical; }
    input:focus, select:focus, textarea:focus { border-color: var(--teal); box-shadow: 0 0 0 3px rgba(12, 92, 86, 0.15); }
    .row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 16px; }
    .btn {
      border: 1px solid transparent;
      border-radius: 10px;
      padding: 10px 14px;
      background: var(--teal);
      color: #f4fffc;
      font-weight: 650;
    }
    .btn.secondary { background: #fff; color: var(--ink); border-color: var(--line); }
    .btn.danger { background: #fff; color: var(--danger); border-color: #e4c4c4; }
    .btn:disabled { opacity: 0.45; cursor: not-allowed; }
    .status { min-height: 1.3em; margin: 12px 0 0; font-size: 14px; }
    .status.bad { color: var(--danger); }
    .status.good { color: var(--ok); }
    .demo { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
    .demo button { background: var(--chip); border: 1px solid var(--line); border-radius: 999px; padding: 6px 10px; }
    .fine { color: var(--muted); font-size: 12px; margin-top: 16px; }
    header.app {
      background: var(--teal-deep);
      color: #f3fbf8;
      padding: 16px 0 14px;
    }
    header.app .wrap { display: flex; justify-content: space-between; gap: 16px; align-items: center; }
    header.app p { margin: 2px 0 0; color: #c9e3de; font-size: 13px; }
    header.app h1 { font-size: 20px; }
    .who { text-align: right; }
    .who strong { display: block; }
    nav.tabs { display: flex; gap: 8px; flex-wrap: wrap; margin: 16px 0; }
    nav.tabs button[aria-selected="true"] { background: var(--teal); color: white; border-color: var(--teal); }
    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 18px;
      box-shadow: var(--shadow);
      margin-bottom: 28px;
    }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 16px; }
    .span-2 { grid-column: span 2; }
    .choices { display: flex; gap: 16px; align-items: center; padding-top: 8px; }
    .choices label { margin: 0; font-weight: 600; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { text-align: left; padding: 8px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
    th { font-size: 12px; letter-spacing: 0.02em; color: var(--muted); font-weight: 700; }
    .mono { font-family: ui-monospace, "Cascadia Mono", Consolas, monospace; font-size: 12px; }
    .pill { display: inline-block; border-radius: 999px; padding: 2px 8px; font-size: 12px; font-weight: 700; }
    .pill.amd { background: var(--amd-bg); color: var(--amd); }
    .pill.wipro { background: var(--wipro-bg); color: var(--wipro); }
    .filters { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 12px; }
    .cards { display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px; margin: 4px 0 16px; }
    .kpi { background: var(--chip); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
    .kpi.amd { background: var(--amd-bg); }
    .kpi.wipro { background: var(--wipro-bg); }
    .kpi strong { display: block; font-size: 24px; line-height: 1.1; color: var(--teal-deep); }
    .kpi span { font-size: 12px; color: var(--muted); }
    .duo { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px; }
    .duo.single { grid-template-columns: 1fr; }
    .box { border: 1px solid var(--line); border-radius: 12px; background: #fff; padding: 10px 12px; }
    .box h3 { font-size: 14px; margin: 0 0 6px; }
    .box ul { list-style: none; margin: 0; padding: 0; max-height: 150px; overflow: auto; }
    .box li { padding: 5px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
    .box li:last-child { border-bottom: 0; }
    .tag { display: inline-block; min-width: 92px; font-weight: 700; }
    .tag.warn { color: var(--warn); }
    .tag.bad { color: var(--danger); }
    .details { display: grid; grid-template-columns: 140px 1fr; gap: 6px 12px; margin: 8px 0 18px; }
    .details dt { color: var(--muted); }
    .details dd { margin: 0; font-weight: 650; }
    .user-pick { background: #fff; }
    .user-pick[aria-current="true"] { outline: 2px solid var(--teal); }
    @media (max-width: 800px) {
      .grid, .filters, .duo { grid-template-columns: 1fr; }
      .cards { grid-template-columns: repeat(2, 1fr); }
      .span-2 { grid-column: auto; }
      header.app .wrap, .who { text-align: left; display: block; }
    }
  </style>
</head>

  <script>
    const SHOW_DEMO_ACCOUNTS = true;
    const STORAGE_KEY = "hwlab.ims.v2";
    const SESSION_KEY = "hwlab.ims.session";
    const ASSET_TYPES = ["Motherboard", "Add-in Card", "Debugger", "SoC Board", "Power Supply", "Cable", "Other"];
    const STATUSES = ["Available in Lab", "Assigned to Engineer", "Under Maintenance", "Scrapped/Returned"];
    const ROLES = ["Super Admin", "Admin", "Lead Admin", "User"];
    const OWNERS = ["AMD-Specific", "Wipro-Specific"];

    const state = {
      view: "login",
      tab: "dashboard",
      selectedEmp: "",
      filters: { owner: "", status: "", type: "", search: "" }
    };

    function esc(value) {
      return String(value ?? "").replace(/[&<>"']/g, (ch) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      }[ch]));
    }

    function freshSeed() {
      const raw = JSON.parse(document.getElementById("seed-data").textContent);
      raw.assets.forEach((asset) => {
        asset.createdBy = asset.createdBy || "SEED";
        asset.createdAt = asset.createdAt || ((asset.arrivalDate || "2026-01-01") + "T00:00:00");
      });
      raw.audit.forEach((row, index) => { row.id = index + 1; });
      return raw;
    }

    function loadDb() {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (!saved) {
        const seeded = freshSeed();
        localStorage.setItem(STORAGE_KEY, JSON.stringify(seeded));
        return seeded;
      }
      return JSON.parse(saved);
    }

    function saveDb(db) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(db));
    }

    function sessionId() {
      return sessionStorage.getItem(SESSION_KEY) || "";
    }

    function currentUser() {
      const id = sessionId();
      if (!id) return null;
      return loadDb().users.find((user) => user.empId === id && user.active) || null;
    }

    function isCustodian(user) {
      return !!user && (user.role === "Admin" || user.role === "Super Admin");
    }

    function viewBlurb(user) {
      if (user.role === "User") return "Engineer view. You see hardware checked out to you.";
      if (user.role === "Lead Admin") return "Lead view. You see hardware checked out to your team.";
      if (user.role === "Super Admin") return "Super Admin. You approve access and can correct the lab list.";
      return "Inventory custodian. You inward and allocate hardware.";
    }

    function accountState(account) {
      const approval = account.approval || "Approved";
      if (approval === "Pending") return "Pending";
      if (approval === "Rejected") return "Rejected";
      return account.active ? "Active" : "Inactive";
    }

    function isMailId(email) {
      return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email) && email.length <= 120;
    }

    function normalizeId(value) {
      return String(value || "").trim().toUpperCase().replace(/\s+/g, "");
    }

    function normalizeBarcode(value) {
      return String(value || "").toUpperCase().replace(/[\s\r\n\t]+/g, "");
    }

    function validBarcode(code) {
      return /^[A-Z0-9_-]{4,64}$/.test(code);
    }

    function isIsoDate(value) {
      if (!/^\d{4}-\d{2}-\d{2}$/.test(value)) return false;
      const [year, month, day] = value.split("-").map(Number);
      const date = new Date(Date.UTC(year, month - 1, day));
      return date.getUTCFullYear() === year && date.getUTCMonth() === month - 1 && date.getUTCDate() === day;
    }

    function nowStamp() {
      const date = new Date();
      const pad = (n) => String(n).padStart(2, "0");
      return date.getFullYear() + "-" + pad(date.getMonth() + 1) + "-" + pad(date.getDate())
        + "T" + pad(date.getHours()) + ":" + pad(date.getMinutes()) + ":" + pad(date.getSeconds());
    }

    function fileStamp() {
      return nowStamp().replace(/[-:T]/g, "");
    }

    function typeFromPrefix(barcode) {
      const token = (barcode.split("-")[0] || barcode.slice(0, 3));
      return {
        MB: "Motherboard",
        AIC: "Add-in Card",
        DBG: "Debugger",
        SOC: "SoC Board",
        PSU: "Power Supply",
        CBL: "Cable"
      }[token] || "";
    }

    function familyPrefix(barcode) {
      const dash = barcode.lastIndexOf("-");
      return dash > 0 ? barcode.slice(0, dash) : barcode;
    }

    function latestSibling(barcode) {
      const family = familyPrefix(barcode);
      return loadDb().assets
        .filter((asset) => asset.barcode !== barcode && asset.barcode.startsWith(family))
        .sort((a, b) => String(b.createdAt).localeCompare(String(a.createdAt)))[0] || null;
    }

    function latestModel(model) {
      const key = model.trim().toUpperCase();
      if (!key) return null;
      return loadDb().assets
        .filter((asset) => String(asset.model || "").toUpperCase() === key)
        .sort((a, b) => String(b.createdAt).localeCompare(String(a.createdAt)))[0] || null;
    }

    function findUser(db, empId) {
      return db.users.find((user) => user.empId === normalizeId(empId)) || null;
    }

    function captureFilters() {
      if (!document.getElementById("filter-owner")) return;
      state.filters = {
        owner: valueOf("filter-owner"),
        status: valueOf("filter-status"),
        type: valueOf("filter-type"),
        search: valueOf("filter-search").trim()
      };
    }

    function inScope(db, user, asset) {
      if (user.role === "User") return asset.assigneeId === user.empId;
      if (user.role === "Lead Admin") {
        const assignee = findUser(db, asset.assigneeId);
        const onTeam = assignee && (assignee.leadId || "") === user.empId;
        return asset.assigneeId === user.empId || !!onTeam;
      }
      return true;
    }

    function scopedAssets(db, user) {
      return db.assets.filter((asset) => inScope(db, user, asset));
    }

    function visibleAssets(db, user) {
      const ownership = state.filters.owner;
      const status = state.filters.status;
      const assetType = state.filters.type;
      const search = state.filters.search.toUpperCase();
      return scopedAssets(db, user).filter((asset) => {
        if (ownership && asset.ownership !== ownership) return false;
        if (status && asset.status !== status) return false;
        if (assetType && asset.assetType !== assetType) return false;
        if (!search) return true;
        const haystack = [asset.barcode, asset.model, liveName(db, asset), asset.assigneeId, asset.poNumber,
          asset.manufacturer, asset.mfsSerialNo, asset.description].join(" ").toUpperCase();
        return haystack.includes(search);
      }).sort((a, b) => a.barcode.localeCompare(b.barcode));
    }

    function countAssets(rows) {
      const counts = { total: rows.length, available: 0, assigned: 0, maintenance: 0, scrapped: 0, amd: 0, wipro: 0 };
      rows.forEach((asset) => {
        if (asset.status === "Available in Lab") counts.available += 1;
        if (asset.status === "Assigned to Engineer") counts.assigned += 1;
        if (asset.status === "Under Maintenance") counts.maintenance += 1;
        if (asset.status === "Scrapped/Returned") counts.scrapped += 1;
        if (asset.ownership === "AMD-Specific") counts.amd += 1;
        if (asset.ownership === "Wipro-Specific") counts.wipro += 1;
      });
      return counts;
    }

    function expiryRows(rows) {
      return rows
        .filter((asset) => asset.status !== "Scrapped/Returned" && expiryNote(asset.expiryDate))
        .sort((a, b) => a.expiryDate.localeCompare(b.expiryDate));
    }

    function personText(db, empId) {
      if (!empId) return "Not assigned";
      const person = findUser(db, empId);
      return person ? empId + " " + person.name : empId;
    }

    function newestFirst(rows) {
      return rows.slice().sort((a, b) => String(b.timestamp).localeCompare(String(a.timestamp)) || (b.id || 0) - (a.id || 0));
    }

    function stamp(raw) {
      return String(raw || "").replace("T", " ").slice(0, 16);
    }

    function valueOf(id) {
      const node = document.getElementById(id);
      return node ? node.value : "";
    }

    function setStatus(text, kind) {
      const node = document.getElementById("form-status");
      if (!node) return;
      node.textContent = text;
      node.className = "status " + (kind || "");
    }

    function options(list, includeBlank, selected) {
      const blank = includeBlank ? "<option value=''>All</option>" : "";
      return blank + list.map((item) => (
        `<option value="${esc(item)}"${item === selected ? " selected" : ""}>${esc(item)}</option>`
      )).join("");
    }

    function ownershipPill(value) {
      const kind = value === "Wipro-Specific" ? "wipro" : "amd";
      return `<span class="pill ${kind}">${esc(value)}</span>`;
    }

    function liveName(db, asset) {
      if (!asset.assigneeId) return "";
      const person = findUser(db, asset.assigneeId);
      return person ? person.name : (asset.assigneeName || "");
    }

    function expiryNote(iso) {
      if (!isIsoDate(iso)) return "";
      const exp = new Date(iso + "T00:00:00");
      const today = new Date();
      today.setHours(0, 0, 0, 0);
      const soon = new Date(today);
      soon.setDate(soon.getDate() + 30);
      if (exp < today) return " (Expired)";
      if (exp <= soon) return " (Expiring soon)";
      return "";
    }

    function statusMoveAllowed(fromStatus, toStatus, role) {
      if (role === "Super Admin") return true;
      if (fromStatus === toStatus) return true;
      if (fromStatus === "Scrapped/Returned") return false;
      const allowed = {
        "Available in Lab": ["Assigned to Engineer", "Under Maintenance", "Scrapped/Returned"],
        "Assigned to Engineer": ["Available in Lab", "Under Maintenance", "Scrapped/Returned"],
        "Under Maintenance": ["Available in Lab", "Assigned to Engineer", "Scrapped/Returned"]
      };
      return (allowed[fromStatus] || []).includes(toStatus);
    }

    function serialTaken(db, serial, barcode) {
      const key = serial.trim().toUpperCase();
      if (!key) return false;
      return db.assets.some((asset) => asset.barcode !== barcode && (asset.mfsSerialNo || "").trim().toUpperCase() === key);
    }

    function downloadText(filename, text, type) {
      const blob = new Blob([text], { type });
      const link = document.createElement("a");
      const url = URL.createObjectURL(blob);
      link.href = url;
      link.download = filename;
      document.body.appendChild(link);
      link.click();
      link.remove();
      URL.revokeObjectURL(url);
    }

    function downloadCsv(filename, rows) {
      const csv = rows.map((row) => row.map((cell) => {
        let text = String(cell ?? "").replace(/[\r\n]+/g, " ").replace(/"/g, '""');
        if (/^[=+\-@\t\r]/.test(text)) text = "'" + text;
        return `"${text}"`;
      }).join(",")).join("\r\n");
      const blob = new Blob(["\uFEFF" + csv], { type: "text/csv;charset=utf-8" });
      const link = document.createElement("a");
      const url = URL.createObjectURL(blob);
      link.href = url;
      link.download = filename;
      document.body.appendChild(link);
      link.click();
      link.remove();
      URL.revokeObjectURL(url);
    }

    function summaryHtml(db, user) {

        });

      expiryRows(scoped).forEach((asset) => {
        const expired = expiryNote(asset.expiryDate) === " (Expired)";
        items.push(`<li><span class="tag mono ${expired ? "bad" : "warn"}">${esc(asset.barcode)}</span>${expired ? "Expired" : "Expires"} ${esc(asset.expiryDate)} · ${esc(asset.model)} · ${asset.assigneeId ? "held by " + esc(asset.assigneeId) : "in the lab"}</li>`);

        const recent = newestFirst(db.audit).slice(0, 10);

        <label for="lead-pick">Lead Admin for this person</label>
        <select id="lead-pick"><option value="">None</option>${leads.map((lead) => `<option value="${esc(lead.empId)}"${lead.empId === (selected.leadId || "") ? " selected" : ""}>${esc(lead.empId)} ${esc(lead.name)}</option>`).join("")}</select>
        <label><input id="active-pick" type="checkbox" ${(selected.active || accountState(selected) === "Pending") ? "checked" : ""}> Approve and allow sign-in</label>
        <div class="row">
          <button class="btn" type="button" data-action="save-role">Save role</button>
          <button class="btn secondary" type="button" data-action="reject-user">Reject</button>
        </div>` : "<p class='sub'>Select an account.</p>";
      return `
        <h2>Access approval</h2>
        <p class="sub">Pick a person, choose the real role (and a lead for a User), tick Approve, then Save. Reject closes a request. Waiting requests are listed first.</p>
        <div class="row">${cards}</div>
        ${editor}
        <h2 style="margin-top:22px">Lab directory</h2>
        <p class="sub">Only an alias on this list can request access. The mail ID and full name must match.</p>
        <label for="allow-alias">Alias ID</label>
        <input id="allow-alias" maxlength="32" autocomplete="off">
        <label for="allow-email">Mail ID</label>
        <input id="allow-email" maxlength="120" autocomplete="off">
        <label for="allow-name">Full name</label>
        <input id="allow-name" maxlength="120" autocomplete="off">
        <div class="row"><button class="btn secondary" type="button" data-action="add-directory">Add to directory</button></div>
        <h2 style="margin-top:22px">Reset sample data</h2>
        <label for="reset-confirm">Type RESET to download a backup, erase this browser's inventory, and restore the sample set.</label>
        <input id="reset-confirm" autocomplete="off">
        <div class="row"><button class="btn danger" type="button" data-action="reset-db">Restore sample data</button></div>
        <p id="form-status" class="status" role="status"></p>`;
    }

    function readOwnership() {
      const picked = document.querySelector('input[name="ownership"]:checked');
      return picked ? picked.value : "";
    }

    function fillIfEmpty(id, value) {
      const node = document.getElementById(id);
      if (node && !node.value && value) node.value = value;
    }

    const actions = {
      fill(button) {
        document.getElementById("auth-emp").value = button.dataset.id;
        document.getElementById("auth-code").value = button.dataset.code;
        setStatus("", "");
      },
      "show-register"() { state.view = "register"; paint(); },
      "show-login"() { state.view = "login"; paint(); },
      login() {
        const db = loadDb();
        const empId = normalizeId(valueOf("auth-emp"));
        const code = valueOf("auth-code").trim();
        const user = findUser(db, empId);
        if (!user || user.accessCode !== code) {
          setStatus("Alias ID or access code is not recognized.", "bad");
          return;
        }
        const approval = user.approval || "Approved";
        if (approval === "Pending") {
          setStatus("This alias is waiting for Super Admin approval.", "bad");
          return;
        }
        if (approval === "Rejected") {
          setStatus("This request was not approved. Ask a Super Admin.", "bad");
          return;
        }
        if (!user.active) {
          setStatus("This alias is inactive. Ask a Super Admin to turn it back on.", "bad");
          return;
        }
        sessionStorage.setItem(SESSION_KEY, user.empId);
        state.tab = "dashboard";
        state.filters = { owner: "", status: "", type: "", search: "" };
        paint();
      },
      register() {
        const db = loadDb();
        const empId = normalizeId(valueOf("reg-emp"));
        const name = valueOf("reg-name").trim();
        const email = valueOf("reg-email").trim().toLowerCase();
        const requestedRole = valueOf("reg-role") || "User";
        const code = valueOf("reg-code").trim();
        const confirm = valueOf("reg-confirm").trim();
        if (!/^[A-Z0-9-]{2,32}$/.test(empId)) {
          setStatus("Alias ID must be 2 to 32 letters, digits, or hyphens.", "bad");
          return;
        }
        if (!name || name.length > 120) {
          setStatus("Enter the full name.", "bad");
          return;
        }
        if (!isMailId(email)) {
          setStatus("Enter the mail ID in the form name@company.com.", "bad");
          return;
        }
        if (!ROLES.includes(requestedRole)) {
          setStatus("Choose a requested role.", "bad");
          return;
        }
        if (code.length < 4 || code.length > 32) {
          setStatus("The lab access code must be 4 to 32 characters.", "bad");
          return;
        }
        if (code !== confirm) {
          setStatus("The access code and the confirmation do not match.", "bad");
          return;
        }
        const listed = (db.directory || []).find((person) => person.alias === empId);
        if (!listed) {
          setStatus("That alias is not on the lab directory. A Super Admin adds a person before they can request access.", "bad");
          return;
        }
        if ((listed.email || "").toLowerCase() !== email) {
          setStatus("The mail ID does not match the lab directory for this alias.", "bad");
          return;
        }
        if (listed.name && listed.name.toLowerCase() !== name.toLowerCase()) {
          setStatus("The full name does not match the lab directory for this alias.", "bad");
          return;
        }
        const existing = findUser(db, empId);
        if (existing) {
          setStatus(existing.approval === "Rejected"
            ? "This alias was not approved. Ask a Super Admin to review it again."
            : "That alias is already registered. Sign in, or wait for Super Admin approval.", "bad");
          return;
        }
        db.users.push({
          empId, name, email, role: "User", requestedRole, approval: "Pending",
          leadId: "", accessCode: code, active: false
        });
        saveDb(db);
        state.view = "login";
        paint();
        setStatus("Request sent for " + empId + ". A Super Admin must approve it before sign-in.", "good");
      },
      logout() {
        sessionStorage.removeItem(SESSION_KEY);
        state.view = "login";
        paint();
      },
      tab(button) {
        state.tab = button.dataset.tab;
        paint();
      },
      refresh() {
        captureFilters();
        paint();
      },
      lookupInward() {
        const code = normalizeBarcode(valueOf("inward-barcode"));
        const box = document.getElementById("inward-barcode");
        if (box) box.value = code;
        if (!validBarcode(code)) {
          setStatus("Barcode must be 4 to 64 letters, digits, hyphens, or underscores.", "bad");
          return;
        }
        const existing = loadDb().assets.find((asset) => asset.barcode === code);
        if (existing) {
          const form = document.getElementById("inward-form");
          form.dataset.mode = "update";
          document.querySelectorAll('input[name="ownership"]').forEach((node) => {
            node.checked = node.value === existing.ownership;
          });
          document.getElementById("inward-type").value = existing.assetType;
          document.getElementById("inward-po").value = existing.poNumber || "";
          document.getElementById("inward-mfr").value = existing.manufacturer || "";
          document.getElementById("inward-serial").value = existing.mfsSerialNo || "";
          document.getElementById("inward-make").value = existing.make || "";
          document.getElementById("inward-model").value = existing.model || "";
          document.getElementById("inward-rev").value = existing.capacityRev || "";
          document.getElementById("inward-desc").value = existing.description || "";
          document.getElementById("inward-arrival").value = existing.arrivalDate || "";
          document.getElementById("inward-expiry").value = existing.expiryDate || "";
          document.getElementById("inward-assignee").value = existing.assigneeId || "";
          document.getElementById("inward-assignee").disabled = true;
          form.dataset.revision = String(existing.revision || 0);
          setStatus("This barcode is already on file. Saving updates metadata only. Use Transfer to change the assignee.", "good");
          return;
        }
        document.getElementById("inward-form").dataset.mode = "create";
        document.getElementById("inward-assignee").disabled = false;
        const guessed = typeFromPrefix(code);
        if (guessed) document.getElementById("inward-type").value = guessed;
        const sibling = latestSibling(code);
        if (sibling) {
          fillIfEmpty("inward-mfr", sibling.manufacturer);
          fillIfEmpty("inward-make", sibling.make);
          fillIfEmpty("inward-model", sibling.model);
          fillIfEmpty("inward-rev", sibling.capacityRev);
          if (!document.getElementById("inward-type").value) document.getElementById("inward-type").value = sibling.assetType;
          setStatus("New barcode. Empty fields were filled from the latest " + familyPrefix(code) + " asset.", "good");
        } else {
          setStatus("New barcode. Fill the purchase order before saving.", "good");
        }
      },
      saveInward() {
        const user = currentUser();
        if (!isCustodian(user)) return;
        const db = loadDb();
        const barcode = normalizeBarcode(valueOf("inward-barcode"));
        const ownership = readOwnership();
        const assetType = valueOf("inward-type");
        const poNumber = valueOf("inward-po").trim();
        const arrival = valueOf("inward-arrival").trim();
        const expiry = valueOf("inward-expiry").trim();
        if (!validBarcode(barcode)) return setStatus("Barcode must be 4 to 64 letters, digits, hyphens, or underscores.", "bad");
        if (!OWNERS.includes(ownership)) return setStatus("Choose ownership: AMD-Specific or Wipro-Specific.", "bad");
        if (!ASSET_TYPES.includes(assetType)) return setStatus("Choose an asset type.", "bad");
        if (!poNumber) return setStatus("Purchase order number is required.", "bad");
        if (arrival && !isIsoDate(arrival)) return setStatus("Arrival date must be YYYY-MM-DD.", "bad");
        if (expiry && !isIsoDate(expiry)) return setStatus("Expiry date must be YYYY-MM-DD.", "bad");
        const existing = db.assets.find((asset) => asset.barcode === barcode);
        const meta = {
          ownership, assetType, poNumber,
          manufacturer: valueOf("inward-mfr").trim(),
          mfsSerialNo: valueOf("inward-serial").trim(),
          make: valueOf("inward-make").trim(),
          model: valueOf("inward-model").trim(),
          capacityRev: valueOf("inward-rev").trim(),
          description: valueOf("inward-desc").trim(),
          arrivalDate: arrival,
          expiryDate: expiry
        };
        if (serialTaken(db, meta.mfsSerialNo, barcode)) {
          return setStatus("Manufacturer serial number " + meta.mfsSerialNo + " is already recorded on another asset.", "bad");
        }
        if (existing) {
          const form = document.getElementById("inward-form");
          const seen = Number((form && form.dataset.revision) || 0);
          if (Number(existing.revision || 0) !== seen) {
            return setStatus("Someone else saved this asset. Scan it again and retry.", "bad");
          }
          Object.assign(existing, meta);
          existing.revision = seen + 1;
          saveDb(db);
          setStatus("Metadata updated for " + barcode + ". Assignee and status were left unchanged.", "good");
          return;
        }
        const assigneeId = normalizeId(valueOf("inward-assignee"));
        let assigneeName = "";
        let status = "Available in Lab";
        if (assigneeId) {
          const assignee = findUser(db, assigneeId);
          if (!assignee || !assignee.active) return setStatus("Initial assignee " + assigneeId + " is not an active employee.", "bad");
          assigneeName = assignee.name;
          status = "Assigned to Engineer";
        }
        db.assets.push({
          barcode, ...meta, assigneeId, assigneeName, status,
          revision: 0,
          createdBy: user.empId, createdAt: nowStamp()
        });
        db.audit.push({
          id: db.audit.reduce((max, row) => Math.max(max, row.id || 0), 0) + 1,
          timestamp: nowStamp(),
          barcode,
          previousAssigneeId: "",
          newAssigneeId: assigneeId,
          transferredBy: user.empId,
          remarks: "Inward receipt"
        });
        saveDb(db);
        paint();
        setStatus("Inward saved for " + barcode + ".", "good");
      },
      "clear-inward"() { paint(); },
      lookupTransfer() {
        const code = normalizeBarcode(valueOf("transfer-barcode"));
        const box = document.getElementById("transfer-barcode");
        if (box) box.value = code;
        const asset = loadDb().assets.find((item) => item.barcode === code);
        const summary = document.getElementById("transfer-summary");
        const form = document.getElementById("transfer-form");
        if (form) form.dataset.revision = asset ? String(asset.revision || 0) : "";
        if (!asset) {
          summary.textContent = "Barcode " + code + " is not in the lab database.";
          const emptyHistory = document.getElementById("transfer-history");
          if (emptyHistory) emptyHistory.innerHTML = '<p class="sub">Every earlier holder appears here after a scan, newest first.</p>';
          setStatus("Barcode was not found. Use Inward to add it.", "bad");
          return;
        }
        const db = loadDb();
        const who = asset.assigneeId ? (asset.assigneeId + " " + liveName(db, asset)) : "nobody (in the lab)";
        summary.textContent = asset.ownership + " · " + asset.assetType + " · " + (asset.model || "no model")
          + " · Current holder: " + who + " · Status: " + asset.status + expiryNote(asset.expiryDate);
        const history = document.getElementById("transfer-history");
        if (history) history.innerHTML = historyHtml(db, code);
        setStatus("Asset loaded. Choose the new status and record the transfer.", "good");
      },
      saveTransfer() {
        const user = currentUser();
        if (!isCustodian(user)) return;
        const db = loadDb();
        const barcode = normalizeBarcode(valueOf("transfer-barcode"));
        const newStatus = valueOf("transfer-status") || "Assigned to Engineer";
        const newEmp = normalizeId(valueOf("transfer-emp"));
        const remarks = valueOf("transfer-notes").trim();
        const asset = db.assets.find((item) => item.barcode === barcode);
        if (!asset) return setStatus("Barcode " + barcode + " is not in the lab database.", "bad");
        if (!STATUSES.includes(newStatus)) return setStatus("Choose a status.", "bad");
        if (!statusMoveAllowed(asset.status, newStatus, user.role)) {
          return setStatus("Status cannot move from " + asset.status + " to " + newStatus + ".", "bad");
        }
        if (newStatus === "Scrapped/Returned" && !remarks) return setStatus("Enter remarks when scrapping or returning an asset.", "bad");
        const form = document.getElementById("transfer-form");
        const seen = Number((form && form.dataset.revision) || 0);
        if (Number(asset.revision || 0) !== seen) {
          return setStatus("Someone else saved this asset. Scan it again and retry.", "bad");
        }
        const previous = asset.assigneeId || "";
        let storedId = "";
        let storedName = "";
        if (newStatus === "Assigned to Engineer") {
          if (!newEmp) return setStatus("Enter the target employee ID.", "bad");
          const assignee = findUser(db, newEmp);
          if (!assignee || !assignee.active) return setStatus("Employee " + newEmp + " is not an active user.", "bad");
          storedId = assignee.empId;
          storedName = assignee.name;
        } else if (newStatus === "Available in Lab" || newStatus === "Scrapped/Returned") {
          if (newEmp) return setStatus("Clear the target employee ID when returning a board to the cage or scrapping it.", "bad");
        } else if (newEmp) {
          const assignee = findUser(db, newEmp);
          if (!assignee || !assignee.active) return setStatus("Employee " + newEmp + " is not an active user.", "bad");
          storedId = assignee.empId;
          storedName = assignee.name;
        } else {
          storedId = previous;
          storedName = liveName(db, asset);
        }
        if (newStatus === asset.status && storedId === previous) {
          return setStatus("This transfer does not change the assignee or the status.", "bad");
        }
        asset.assigneeId = storedId;
        asset.assigneeName = storedName;
        asset.status = newStatus;
        asset.revision = seen + 1;
        db.audit.push({
          id: db.audit.reduce((max, row) => Math.max(max, row.id || 0), 0) + 1,
          timestamp: nowStamp(),
          barcode,
          previousAssigneeId: previous,
          newAssigneeId: storedId,
          transferredBy: user.empId,
          remarks
        });
        saveDb(db);
        actions.lookupTransfer();
        document.getElementById("transfer-emp").value = "";
        document.getElementById("transfer-notes").value = "";
        setStatus("Transfer recorded for " + barcode + ".", "good");
      },
      "export-inventory"() {
        captureFilters();
        const user = currentUser();
        const rows = visibleAssets(loadDb(), user);
        const header = ["Barcode", "Ownership", "Asset Type", "Model", "PO Number", "Status", "Assignee ID", "Assignee Name", "Manufacturer", "Mfr Serial", "Make", "Capacity / Rev", "Description", "Arrival Date", "Expiry Date"];
        const body = rows.map((asset) => [
          asset.barcode, asset.ownership, asset.assetType, asset.model, asset.poNumber,
          asset.status + expiryNote(asset.expiryDate),
          asset.assigneeId, liveName(loadDb(), asset), asset.manufacturer, asset.mfsSerialNo, asset.make,
          asset.capacityRev, asset.description, asset.arrivalDate, asset.expiryDate
        ]);
        downloadCsv("LabInventory_" + fileStamp() + ".csv", [header, ...body]);
        paint();
        setStatus("Inventory snapshot downloaded.", "good");
      },
      "export-audit"() {
        captureFilters();
        const user = currentUser();
        if (!isCustodian(user)) return;
        const visible = new Set(visibleAssets(loadDb(), user).map((asset) => asset.barcode));
        const header = ["Log ID", "Timestamp", "Asset Barcode", "Previous Assignee ID", "New Assignee ID", "Transferred By", "Remarks"];
        const body = loadDb().audit
          .filter((row) => visible.has(row.barcode))
          .map((row) => [row.id, row.timestamp, row.barcode, row.previousAssigneeId, row.newAssigneeId, row.transferredBy, row.remarks]);
        downloadCsv("LabAudit_" + fileStamp() + ".csv", [header, ...body]);
        paint();
        setStatus("Audit snapshot for the assets on screen downloaded.", "good");
      },
      "backup-now"() {
        const actor = currentUser();
        if (!actor || actor.role !== "Super Admin") return;
        captureFilters();
        const name = "IMS_backup_" + fileStamp() + ".json";
        downloadText(name, JSON.stringify(loadDb(), null, 2), "application/json");
        setStatus("Backup saved: " + name + " (in this browser's Downloads folder).", "good");
      },
      changeCode() {
        const user = currentUser();
        if (!user) return;
        const current = valueOf("code-current").trim();
        const next = valueOf("code-new").trim();
        const confirm = valueOf("code-confirm").trim();
        if (!current) return setStatus("Enter your current access code.", "bad");
        if (next.length < 4 || next.length > 32) return setStatus("The new access code must be 4 to 32 characters.", "bad");
        if (next !== confirm) return setStatus("The new code and the confirmation do not match.", "bad");
        if (next === current) return setStatus("Choose a new code that differs from the current one.", "bad");
        const db = loadDb();
        const me = findUser(db, user.empId);
        if (!me || me.accessCode !== current) return setStatus("The current access code is not correct.", "bad");
        me.accessCode = next;
        saveDb(db);
        paint();
        setStatus("Your access code was changed. Use the new code next time you sign in.", "good");
      },
      "select-user"(button) {
        state.selectedEmp = button.dataset.id;
        paint();
      },
      "save-role"() {
        const actor = currentUser();
        if (!actor || actor.role !== "Super Admin") return;
        const db = loadDb();
        const target = findUser(db, state.selectedEmp);
        if (!target) return setStatus("Select an account first.", "bad");
        const newRole = valueOf("role-pick");
        const makeActive = document.getElementById("active-pick").checked;
        const activeSupers = db.users.filter((user) => user.role === "Super Admin" && user.active);
        if (target.empId === actor.empId && !makeActive) {
          return setStatus("You cannot turn off your own account.", "bad");
        }
        const leadId = valueOf("lead-pick");
        if (newRole === "User" && leadId) {
          const lead = findUser(db, leadId);
          if (!lead || lead.role !== "Lead Admin" || !lead.active) {
            return setStatus("Choose an active Lead Admin for this person's team.", "bad");
          }
        }
        target.leadId = newRole === "User" ? leadId : "";
        if (target.role === "Super Admin" && target.active && activeSupers.length <= 1 && (newRole !== "Super Admin" || !makeActive)) {
          return setStatus("Keep at least one active Super Admin.", "bad");
        }
        target.role = newRole;
        target.active = makeActive;
        if (makeActive) target.approval = "Approved";
        saveDb(db);
        paint();
        setStatus("Saved " + target.empId + ".", "good");
      },
      "reject-user"() {
        const actor = currentUser();
        if (!actor || actor.role !== "Super Admin") return;
        const db = loadDb();
        const target = findUser(db, state.selectedEmp);
        if (!target) return setStatus("Select an account first.", "bad");
        if (target.empId === actor.empId) return setStatus("You cannot reject your own account.", "bad");
        target.active = false;
        target.approval = "Rejected";
        saveDb(db);
        paint();
        setStatus("Rejected " + target.empId + ".", "good");
      },
      "add-directory"() {
        const actor = currentUser();
        if (!actor || actor.role !== "Super Admin") return;
        const alias = normalizeId(valueOf("allow-alias"));
        const email = valueOf("allow-email").trim().toLowerCase();
        const name = valueOf("allow-name").trim();
        if (!/^[A-Z0-9-]{2,32}$/.test(alias)) return setStatus("Alias ID must be 2 to 32 letters, digits, or hyphens.", "bad");
        if (!isMailId(email)) return setStatus("Enter the mail ID in the form name@company.com.", "bad");
        if (!name) return setStatus("Enter the full name on the company record.", "bad");
        const db = loadDb();
        db.directory = db.directory || [];
        const existing = db.directory.find((person) => person.alias === alias);
        if (existing) {
          existing.email = email;
          existing.name = name;
        } else {
          db.directory.push({ alias, email, name });
        }
        saveDb(db);
        paint();
        setStatus("Directory updated for " + alias + ".", "good");
      },
      "reset-db"() {
        const actor = currentUser();
        if (!actor || actor.role !== "Super Admin") return;
        if (valueOf("reset-confirm").trim().toUpperCase() !== "RESET") {
          setStatus("Type RESET to restore the sample data.", "bad");
          return;
        }
        downloadText("IMS_backup_" + fileStamp() + ".json", JSON.stringify(loadDb(), null, 2), "application/json");
        localStorage.setItem(STORAGE_KEY, JSON.stringify(freshSeed()));
        state.selectedEmp = "";
        state.tab = "dashboard";
        paint();
        setStatus("A backup file was downloaded, then the sample data was restored in this browser.", "good");
      }
    };

    document.addEventListener("click", (event) => {
      const button = event.target.closest("[data-action]");
      if (!button) return;
      if (button.dataset.action === "refresh" && event.type === "click" && button.tagName === "SELECT") return;
      const action = actions[button.dataset.action];
      if (action) action(button);
    });

    document.addEventListener("change", (event) => {
      if (["filter-owner", "filter-status", "filter-type"].includes(event.target.id)) actions.refresh();
      if (event.target.id !== "inward-model") return;
      const form = document.getElementById("inward-form");
      if (!form || form.dataset.mode === "update") return;
      const sibling = latestModel(event.target.value);
      if (!sibling) return;
      fillIfEmpty("inward-mfr", sibling.manufacturer);
      fillIfEmpty("inward-make", sibling.make);
      fillIfEmpty("inward-rev", sibling.capacityRev);
    });

    document.addEventListener("submit", (event) => {
      if (!(event.target instanceof HTMLFormElement)) return;
      event.preventDefault();
      if (event.target.id === "login-form") actions.login();
      if (event.target.id === "register-form") actions.register();
      if (event.target.id === "inward-form") actions.saveInward();
      if (event.target.id === "transfer-form") actions.saveTransfer();
      if (event.target.id === "code-form") actions.changeCode();
    });

    document.addEventListener("keydown", (event) => {
      if (event.key !== "Enter") return;
      if (event.target.id === "inward-barcode") {
        event.preventDefault();
        actions.lookupInward();
      }
      if (event.target.id === "transfer-barcode") {
        event.preventDefault();
        actions.lookupTransfer();
      }
      if (event.target.id === "filter-search") {
        event.preventDefault();
        actions.refresh();
      }
    });

    paint();
  </script>
</body>
</html>
